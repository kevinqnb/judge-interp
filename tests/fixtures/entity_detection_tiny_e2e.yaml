id: entity_detection_tiny_e2e
project: judge-interp
task: entity_detection
description: >-
  Tiny end-to-end fixture for experiments/run_experiment.py's entity_detection
  task: Qwen2.5-0.5B-Instruct on CPU over tests/fixtures/entity_detection_mini, main
  dataset, every row (see tests/test_entity_detection.py for the hand-worked
  rows). Exercises plumbing and determinism only. Expected: n_prompts = 4,
  n_spans = 8 + 8 + 8 + 9 = 33 (doc-b's valid row has all 9 fields non-null,
  each doc-a row has agency null), n_invalid_spans = 2 + 1 = 3
  (n_spans_cross_type = 2, n_spans_inter_document = 1), and
  n_rows_with_mixed_entities = 2.
seed: 0
params:
  data_root: tests/fixtures/entity_detection_mini
  model: Qwen/Qwen2.5-0.5B-Instruct
  dataset_config: experiments/dataset-configs/vrdu_main.py
  split: train
  layers: [0, 12, "last"]
  dtype: float32
  device: cpu
  context_token_limit: null
  verify_read_point: true
  error_types: [inter_document, cross_type]
  rows_per_stratum:
    valid: null
    inter_document: null
    cross_type: null
