id: repr_tiny_e2e
project: judge-interp
description: >-
  Tiny end-to-end fixture for scripts/run_experiment.py: Qwen2.5-0.5B-Instruct on
  CPU over the 3-row hand-built mini corpus. Exercises plumbing and determinism,
  not judge quality (a 0.5B model is not a reliable judge).
seed: 0
params:
  data_root: tests/fixtures/judge_interp_mini
  model: Qwen/Qwen2.5-0.5B-Instruct
  dataset: main
  split: train
  layers: [0, 12, "last"]
  dtype: float32
  device: cpu
  include_cohesion: true
  context_char_limit: null
  row_subset: null
  verify_read_point: true
