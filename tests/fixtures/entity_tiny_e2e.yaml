id: entity_tiny_e2e
project: judge-interp
task: entity_detection
description: >-
  Tiny end-to-end fixture for scripts/run_experiment.py's entity_detection task:
  Qwen2.5-0.5B-Instruct on CPU over tests/fixtures/entity_relation_mini's line
  corpus. Exercises plumbing and determinism (span-to-token mapping, resumable
  per-document caching), not judge quality (a 0.5B model is not a reliable
  judge). Only (doc-x, program_desc) survives the default thresholds -- see
  tests/test_entity_prompts.py for the hand-worked-out expected lists.
seed: 0
params:
  data_root: tests/fixtures/entity_relation_mini
  model: Qwen/Qwen2.5-0.5B-Instruct
  dataset: line
  split: train
  layers: [0, 12, "last"]
  dtype: float32
  device: cpu
  context_token_limit: null
  row_subset: null
  verify_read_point: true
  min_valid_per_list: 1
  min_invalid_per_list: 1
  max_invalid_per_list: 8
