[project]
name = "judge-interp"
version = "0.1.0"
description = "Interpretability for LLM judges in information-extraction validation tasks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# GPU stack for running a local judge with nnsight. Versions track
# ../../coastal/scholarlm's `gpu` extra, the reference nnsight setup.
gpu = [
    "nnsight==0.5.11",
    "nnterp>=1.2.1",
    "torch>=2.4.0",
    "transformers>=4.51.0",
]

# Notebook analysis of collected representations (analysis/*.ipynb). Never
# needed on a GPU job node -- kept separate from `gpu`.
analysis = [
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judge_interp"]
