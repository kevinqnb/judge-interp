id: 2026-11-10-llama8b-relgroup-tiny-01
project: judge-interp
task: relation_grouping
description: >-
  Relation GROUPING instructions (sort the entities into groups by the greedy rule; no verdict) on the SAME rows as 2026-10-27-llama8b-relation-line-test-01, restricted to the first of those documents (plumbing gate) (every row of those documents: all cells, valid and corrupted, so per-(document, field) centring rests on every row). Representations read at each non-null entity's closing quote; nothing is decoded; compare with the original run's PCA/graphs.
  Expected: n_prompts = every row of the 1 document(s); rows identical to the original run's for those documents.
seed: 0
params:
  data_root: data
  model: meta-llama/Llama-3.1-8B-Instruct
  dataset_config: experiments/dataset-configs/vrdu_line.py
  split: test
  # 32 blocks: 0 = token embedding (identical for every entity -> null control), 32 = post-final-norm.
  layers: [0, 8, 16, 24, 28, "last"]
  dtype: bfloat16
  device: cuda
  context_token_limit: 28000
  verify_read_point: true
  prefix_cache: true
  prefix_cache_check_n: 4
  prefix_cache_rtol: 0.1
  document_ids:
    - 0372fe64-8552-92cc-f727-b6e5327e402d
  error_types: [intra_document, cross_item]
  # Every row: null = all rows of the stratum ("valid" + error types, or the 4 cells of the -07 paired dataset).
  rows_per_stratum:
    intra_document:k3: null
    intra_document:k2: null
    intra_document:k1: null
    cross_item:k2: null

  # -- experiments/submit.sh resources --
  # gpu_type is pinned to L40S for every run in this group so runtimes are comparable across
  # models and Clef; walltime is ~2x the tiny-test estimate (2026-10-25-*-tiny-0*: ~0.5 s/prompt
  # for the representation models, 0.7-1.2 s/record for Clef). Shards resume if a job is killed.
  gpu_type: L40S
  gpu_memory: 48G
  gpu_c: 8.9
  omp: 8
  walltime: "00:30:00"
