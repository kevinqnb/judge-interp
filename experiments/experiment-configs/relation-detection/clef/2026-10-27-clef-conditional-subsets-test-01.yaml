id: 2026-10-27-clef-conditional-subsets-test-01
project: judge-interp
task: clef_relation_conditional
description: >-
  Clef-flash relation detection (conditional): the first field of each sample is the primary entity and every other field a condition; one noul question per sample. Line dataset (-07), test SUBSETS only (data/vrdu/line/test_subsets.json): every subset of 2 to m fields of every test full-length sample (clean and invalid parents), 35366 samples, label = the subset's own `valid` (matches_item against the document's real items), so it is NOT balanced: 23795 valid, 11571 invalid, and 6112 invalid-parent subsets show a corrupted field yet are valid. Samples file experiments/clef-samples/conditional-test-subsets.json, built by `experiments/clef_samples.py --split test --source subsets`; its `label_valid` is the subset's `valid` (not derived from the entity flags, which mark the parent's corrupted fields), and `sample_id` is the subset id. Over-length documents (> max_length) are excluded and recorded.
  Efficiency is measured on every run (artifacts/efficiency.json, efficiency_*.npz, flat eff_* keys in metrics.json): per-record wall time (encode / forward / readout), input tokens, questions per record, peak GPU memory; output tokens are 0, Clef reads two logits per question.
  The known-answer record is scored first (it is also the CUDA warmup) and the first 5 records are rescored and must be bitwise identical.
  Walltime: 35366 records x 0.7-1.2 s (2026-10-25 tiny runs) = 7-12 h, doubled. Shards resume if a job is killed.
seed: 0
params:
  data_root: data
  dataset_config: experiments/dataset-configs/vrdu_line.py
  model_config: experiments/model-configs/clef.yaml
  device: cuda
  overlong_docs: exclude
  context_control: none
  determinism_check_n: 5
  known_answer_check: true
  samples_path: experiments/clef-samples/conditional-test-subsets.json

  # -- experiments/submit.sh resources --
  # gpu_type is pinned to L40S for every run in this group so runtimes are comparable across
  # models and Clef; walltime is ~2x the tiny-test estimate (2026-10-25-*-tiny-0*: ~0.5 s/prompt
  # for the representation models, 0.7-1.2 s/record for Clef). Shards resume if a job is killed.
  gpu_type: L40S
  gpu_memory: 48G
  gpu_c: 8.9
  omp: 8
  walltime: "24:00:00"
