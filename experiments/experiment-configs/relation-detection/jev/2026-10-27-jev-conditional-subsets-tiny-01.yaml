id: 2026-10-27-jev-conditional-subsets-tiny-01
project: judge-interp
task: jev_relation_conditional
description: >-
  Tiny end-to-end gate for the subsets runs: 30 test subsets (15 valid, 15 invalid by the subset's own valid label, seeded draw) from experiments/clef-samples/conditional-test-subsets-tiny.json.
  Expected: n_predictions = 30 (15 valid), known-answer and rescoring checks pass, label_valid used as the label; mean P(true) higher on valid than invalid subsets.
seed: 0
params:
  data_root: data
  dataset_config: experiments/dataset-configs/vrdu_line.py
  model_config: experiments/model-configs/jev.yaml
  context_control: none
  determinism_check_n: 5
  determinism_atol: 0.15
  known_answer_check: true
  samples_path: experiments/clef-samples/conditional-test-subsets-tiny.json

  # -- experiments/submit.sh --api resources (CPU job: the model runs remotely) --
  # ~0.1 s/request in the tiny run -> ~1 h for 35366; walltime ~4x that.
  omp: 4
  walltime: "00:30:00"
