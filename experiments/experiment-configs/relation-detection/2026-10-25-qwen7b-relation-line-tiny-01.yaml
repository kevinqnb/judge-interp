id: 2026-10-25-qwen7b-relation-line-tiny-01
project: judge-interp
task: relation_detection
description: >-
  Tiny GPU test of relation detection, line dataset, test split, Qwen2.5-7B-Instruct: 1 pairs (both twins) per stratum, drawn with the seed.
  Confirms GPU plumbing, the efficiency measurement (eff_* metrics, artifacts/efficiency.json) and label bookkeeping only.
  Expected: n_prompts = 30, one read token id, eff_output_tokens_total = 0, eff_n_shards_resumed = 0, GPU peak memory not None.
seed: 0
params:
  data_root: data
  model: Qwen/Qwen2.5-7B-Instruct
  dataset_config: experiments/dataset-configs/vrdu_line.py
  split: test
  layers: [0, 8, 14, 20, 24, "last"]
  dtype: bfloat16
  device: cuda
  context_token_limit: 28000
  verify_read_point: true
  prefix_cache: false
  prefix_cache_check_n: 0
  prefix_cache_rtol: 0.1
  error_types: [intra_document, cross_item]
  rows_per_stratum:
    cross_item:m2:k2: 1
    cross_item:m3:k2: 1
    cross_item:m4:k2: 1
    cross_item:m5:k2: 1
    intra_document:m2:k1: 1
    intra_document:m2:k2: 1
    intra_document:m3:k1: 1
    intra_document:m3:k2: 1
    intra_document:m3:k3: 1
    intra_document:m4:k1: 1
    intra_document:m4:k2: 1
    intra_document:m4:k3: 1
    intra_document:m5:k1: 1
    intra_document:m5:k2: 1
    intra_document:m5:k3: 1

  # -- experiments/submit.sh resources (tiny test) --
  gpu_type: L40S
  gpu_memory: 48G
  gpu_c: 8.9
  omp: 8
  walltime: "00:30:00"
