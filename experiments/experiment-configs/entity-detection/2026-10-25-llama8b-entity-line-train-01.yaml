id: 2026-10-25-llama8b-entity-line-train-01
project: judge-interp
task: entity_detection
description: >-
  Row-based entity detection, line dataset, -06 minimal pairs (15 cells; every invalid row is paired with its clean twin), train split, Llama-3.1-8B-Instruct: one prompt per row (37500 prompts, every row),
  representations read at each non-null entity's closing quote at the layers below, labelled per entity from field_errors.
  Efficiency is measured on every run (artifacts/efficiency.json, efficiency_*.npz, flat eff_* keys in metrics.json): per-prompt wall time (prompt build / trace / readout / cleanup), input tokens, peak GPU memory, and per-layer bytes in memory and in the npz; no output tokens, nothing is decoded.
  Expected: n_prompts = 37500; one read token id; same row set for both models (context_token_limit is shared).
seed: 0
params:
  data_root: data
  model: meta-llama/Llama-3.1-8B-Instruct
  dataset_config: experiments/dataset-configs/vrdu_line.py
  split: train
  # 32 blocks: 0 = token embedding (identical for every entity -> null control), 32 = post-final-norm.
  layers: [0, 8, 16, 24, 28, "last"]
  dtype: bfloat16
  device: cuda
  context_token_limit: 28000
  verify_read_point: true
  prefix_cache: false
  prefix_cache_check_n: 0
  prefix_cache_atol: 0.01
  error_types: [intra_document, cross_item]
  # Every row: null = all rows of the stratum ("valid" + error types, or the 15 cells of a paired dataset).
  rows_per_stratum:
    cross_item:m2:k2: null
    cross_item:m3:k2: null
    cross_item:m4:k2: null
    cross_item:m5:k2: null
    intra_document:m2:k1: null
    intra_document:m2:k2: null
    intra_document:m3:k1: null
    intra_document:m3:k2: null
    intra_document:m3:k3: null
    intra_document:m4:k1: null
    intra_document:m4:k2: null
    intra_document:m4:k3: null
    intra_document:m5:k1: null
    intra_document:m5:k2: null
    intra_document:m5:k3: null

  # -- experiments/submit.sh resources --
  # gpu_type is pinned to L40S for every run in this group so runtimes are comparable across
  # models and Clef; walltime is ~2x the tiny-test estimate (2026-10-25-*-tiny-0*: ~0.5 s/prompt
  # for the representation models, 0.7-1.2 s/record for Clef). Shards resume if a job is killed.
  gpu_type: L40S
  gpu_memory: 48G
  gpu_c: 8.9
  omp: 8
  walltime: "12:00:00"
