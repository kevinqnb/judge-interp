id: 2026-11-05-qwen7b-entity-main-tiny-01
project: judge-interp
task: entity_detection
description: >-
  Tiny end-to-end gate for the 2026-11-05 patched main entity runs with the prefix cache on: test split, 2 rows per stratum (valid, inter_document, cross_type), drawn with the seed; each drawn corrupted row brings its patched rows (read at the target alone). Confirms the cache equivalence check (check_n 4 of 26 rows), the patched-row bookkeeping and the target-only read.
  Expected (computed from the row file with the seed): n_prompts = 26 (6 drawn rows + 20 patched rows), n_spans = 70 (the 6 drawn rows hold 8+9+9+9+8+7 = 50 spans, the 20 patched rows 1 each), eff_prefix_cache_max_rel_diff <= prefix_cache_rtol, eff_n_shards_resumed = 0, eff_output_tokens_total = 0.
seed: 0
params:
  data_root: data
  model: Qwen/Qwen2.5-7B-Instruct
  dataset_config: experiments/dataset-configs/vrdu_main.py
  split: test
  # 28 blocks: 0 = token embedding (identical for every entity -> null control), 28 = post-final-norm.
  layers: [0, 8, 14, 20, 24, "last"]
  dtype: bfloat16
  device: cuda
  context_token_limit: 28000
  verify_read_point: true
  prefix_cache: true
  prefix_cache_check_n: 4
  prefix_cache_rtol: 0.1
  read_fields: target_only   # patched rows: probes read only the target span, Clef / Jev ask every question
  error_types: [inter_document, cross_type]
  # Every row: null = all rows of the stratum ("valid" + error types, or the 15 cells of a paired dataset).
  rows_per_stratum:
    valid: 2
    inter_document: 2
    cross_type: 2

  # -- experiments/submit.sh resources --
  # gpu_type is pinned to L40S for every run in this group so runtimes are comparable across
  # models and Clef; walltime is ~2x the tiny-test estimate (2026-10-25-*-tiny-0*: ~0.5 s/prompt
  # for the representation models, 0.7-1.2 s/record for Clef). Shards resume if a job is killed.
  gpu_type: L40S
  gpu_memory: 48G
  gpu_c: 8.9
  omp: 8
  walltime: "00:30:00"
