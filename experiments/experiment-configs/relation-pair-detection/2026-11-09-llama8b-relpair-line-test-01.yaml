id: 2026-11-09-llama8b-relpair-line-test-01
project: judge-interp
task: relation_pair_detection
description: >-
  Relation pair detection, line dataset (-07 full-length minimal pairs, 4 cells), test split, every row (2000 prompts). Each prompt lists all C(m, 2) entity pairs of one line item, in a random order and orientation seeded by the row's pair_id (shared with its twin), one pair per line; the hidden state is read at each line's closing ' "\n' token at the layers below; pair labels are the size-2 rows of data/vrdu/line/test_subsets.json. Predicted: n_prompts = 2000, n_spans = 14844 pairs, n_spans_corrupted_parent = 7422 (4063 valid), n_valid_spans_with_corrupted_member = 1998, n_spans_ncorr2 = 1250; one read token id. Walltime as the 2026-10-27 relation runs (same prompts plus ~10 short record lines, prefix-cached).
seed: 0
params:
  data_root: data
  model: meta-llama/Llama-3.1-8B-Instruct
  dataset_config: experiments/dataset-configs/vrdu_line.py
  split: test
  # the size-2 rows of this file label the pairs (relative to data_root)
  subsets_path: vrdu/line/{split}_subsets.json
  # 32 blocks: 0 = token embedding (identical for every pair -> null control), 32 = post-final-norm.
  layers: [0, 8, 16, 24, 28, "last"]
  dtype: bfloat16
  device: cuda
  context_token_limit: 28000
  verify_read_point: true
  prefix_cache: true
  prefix_cache_check_n: 4
  prefix_cache_rtol: 0.1
  error_types: [intra_document, cross_item]
  # pairs (an invalid row + its clean twin) per cell; null = every pair
  rows_per_stratum:
    intra_document:k3: null
    intra_document:k2: null
    intra_document:k1: null
    cross_item:k2: null

  # -- experiments/submit.sh resources (as the 2026-10-27 relation runs: L40S pinned for comparable runtimes) --
  gpu_type: L40S
  gpu_memory: 48G
  gpu_c: 8.9
  omp: 8
  walltime: "01:30:00"
