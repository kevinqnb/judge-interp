id: 2026-11-09-jev-relpair-test-01
project: judge-interp
task: jev_relation_conditional
description: >-
  Relation pair detection judge: one conditional sample per entity pair of every CORRUPTED test row of the line dataset (-07), 7422 pairs (4063 valid, label = the pair's size-2 subset `valid`; 1998 valid pairs show a corrupted member). Samples built by `experiments/clef_samples.py --data-root data/vrdu --split test --source line_pairs --seed 0` (seed 0 = the LM runs' seed, so each pair's primary / condition is the LM's first / second field). One noul question per pair.
  No length pre-filter: a request over the API's context limit fails the run. ~0.1 s/request -> ~15 min for 7422; walltime ~8x.
seed: 0
params:
  data_root: data
  dataset_config: experiments/dataset-configs/vrdu_line.py
  model_config: experiments/model-configs/jev.yaml
  context_control: none
  determinism_check_n: 5
  determinism_atol: 0.15
  known_answer_check: true
  samples_path: experiments/clef-samples/conditional-test-pairs.json

  # -- experiments/submit.sh --api resources (CPU job: the model runs remotely) --
  omp: 4
  walltime: "02:00:00"
