id: 2026-11-09-clef-relpair-tiny-01
project: judge-interp
task: clef_relation_conditional
description: >-
  Tiny end-to-end gate for the pair judges: the 40 pairs of the 4 corrupted rows drawn by 2026-11-09-*-relpair-line-tiny-01 (21 valid), filtered by subset_id from conditional-test-pairs.json (the subset_ids of the spans with parent_valid false of judge_interp.relation_pair_detection.build_items(LINE, <that config's params with context_token_limit null>, 0, repo root); the analysis re-checks every judged pair's orientation against the LM run). Samples built by `experiments/clef_samples.py --data-root data/vrdu --split test --source line_pairs --seed 0` (seed 0 = the LM runs' seed, so each pair's primary / condition is the LM's first / second field). Expected: n_predictions = 40 (21 valid), known-answer and rescoring checks pass.
  Over-length documents (> max_length) are excluded and recorded.
seed: 0
params:
  data_root: data
  dataset_config: experiments/dataset-configs/vrdu_line.py
  model_config: experiments/model-configs/clef.yaml
  device: cuda
  overlong_docs: exclude
  context_control: none
  determinism_check_n: 5
  known_answer_check: true
  samples_path: experiments/clef-samples/conditional-test-pairs-tiny.json

  # -- experiments/submit.sh resources (as the 2026-10-27 Clef runs) --
  gpu_type: L40S
  gpu_memory: 48G
  gpu_c: 8.9
  omp: 8
  walltime: "00:30:00"
