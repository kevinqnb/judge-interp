id: 2026-10-27-entity-main-all-smoke-01
project: judge-interp
description: >-
  SMOKE (plumbing only, not a result): first 20 documents of each LM split. Entity detection on main: the Qwen2.5-7B-Instruct (layer 24) and Llama-3.1-8B-Instruct (layer 28) probes, Clef and Jev, all scored on the same minimal pairs of data/vrdu/main/test.json (the rows every method scored). Probes train on data/vrdu/main/train.json only.
seed: 0
params:
  dataset: main
  # every run must have judged exactly these row files (asserted)
  train_rows: data/vrdu/main/train.json
  test_rows: data/vrdu/main/test.json
  models:
    - {label: qwen7b_l24, train_run_id: 2026-10-25-qwen7b-entity-main-train-01, test_run_id: 2026-10-25-qwen7b-entity-main-test-01, layer: 24}
    - {label: llama8b_l28, train_run_id: 2026-10-25-llama8b-entity-main-train-01, test_run_id: 2026-10-25-llama8b-entity-main-test-01, layer: 28}
  # kind: clef | jev. bss_ref_rate: a float in (0, 1), or "evaluation_set_rate"
  judges:
    - {label: clef, kind: clef, run_id: 2026-10-25-clef-entity-main-test-01, bss_ref_rate: evaluation_set_rate}
    - {label: jev, kind: jev, run_id: 2026-10-27-jev-entity-main-test-01, bss_ref_rate: evaluation_set_rate}
  twin_seed: 0   # seeds the other-document twins of null-fill spans
  # logistic regression (lbfgs; ConvergenceWarning is an error); lr_C is the INVERSE regularisation strength
  lr_C: 0.01
  lr_max_iter: 5000
  lr_tol: 0.0001
  decision_threshold: 0.5
  ci_level: 0.95
  # calibration figures and tables (analysis/calibration_report.py): intervals over n_boot document resamples
  report:
    n_boot: 20
    # label -> name in the table / legend; the order is the row and legend order and fixes the tab10 colours
    methods: {qwen7b_l24: qwen, llama8b_l28: llama, clef: clef, jev: jev}
    error_type_names: {inter_document: Inter-document, cross_type: Cross-type}
    font: Nimbus Roman
    white_frac: 0.35   # tab10 colours mixed with this share of white
    mesh_pts: 101
    min_density_frac: 0.02   # a curve is drawn where the predictions' density is at least this share of its maximum
    shuffled_auroc_tolerance: 0.05   # the shuffled-label baseline's AUROC must be within this of 0.5
    figsize: [3.0, 3.0]
  run_controls: true
  # probes only, TRAINING-label shuffle control (leakage check): the test AUROC is averaged over n_train_label_shuffles
  # probes, each refit on permuted TRAIN labels and scored on the real test labels; it must be within the tolerance of 0.5
  n_train_label_shuffles: 5
  train_label_shuffle_auroc_tolerance: 0.1
  # restrict each LM split to its first N documents (null = all)
  max_docs: 20
  omp: 8
  thread_cap: 4
  walltime: "01:00:00"
