id: 2026-10-27-entity-main-all-01
project: judge-interp
description: >-
  Entity detection on main: the Qwen2.5-7B-Instruct (layer 24) and Llama-3.1-8B-Instruct (layer 28) probes, Clef and Jev, all scored on the same minimal pairs of data/vrdu/main/test.json (the rows every method scored). Probes train on data/vrdu/main/train.json only.
seed: 0
params:
  dataset: main
  # every run must have judged exactly these row files (asserted)
  train_rows: data/vrdu/main/train.json
  test_rows: data/vrdu/main/test.json
  models:
    - {label: qwen7b_l24, train_run_id: 2026-10-25-qwen7b-entity-main-train-01, test_run_id: 2026-10-25-qwen7b-entity-main-test-01, layer: 24}
    - {label: llama8b_l28, train_run_id: 2026-10-25-llama8b-entity-main-train-01, test_run_id: 2026-10-25-llama8b-entity-main-test-01, layer: 28}
  # kind: clef | jev. bss_ref_rate: a float in (0, 1), or "evaluation_set_rate"
  judges:
    - {label: clef, kind: clef, run_id: 2026-10-25-clef-entity-main-test-01, bss_ref_rate: evaluation_set_rate}
    - {label: jev, kind: jev, run_id: 2026-10-27-jev-entity-main-test-01, bss_ref_rate: evaluation_set_rate}
  pca_n_components: 2
  pca_svd_solver: randomized
  max_scatter_points: 20000
  twin_seed: 0   # seeds the other-document twins of null-fill spans
  # logistic regression (lbfgs; ConvergenceWarning is an error); lr_C is the INVERSE regularisation strength
  lr_C: 0.01
  lr_max_iter: 5000
  lr_tol: 0.0001
  decision_threshold: 0.5
  # document-bootstrap interval of the AUROC
  auroc_n_boot: 1000
  ci_level: 0.95
  ece_n_boot: 2000
  hist_n_bins: 20
  run_controls: true
  # probes: test AUROC is averaged over n_shuffles permuted-train-label fits
  n_shuffles: 30
  shuffled_label_auroc_tolerance: 0.03
  # judges: mean AUROC over n_shuffles label permutations must be within tolerance of 0.5
  permutation_auroc_tolerance: 0.03
  # restrict each LM split to its first N documents (null = all)
  max_docs: null
  omp: 8
  thread_cap: 4
  # placeholder until the full run sizes it (the single-model analyses took ~1 h)
  walltime: "06:00:00"
