id: 2026-10-26-qwen7b-relset-line-smoke-01
project: judge-interp
description: >-
  SMOKE (plumbing only, not a result): first 20 documents of each split. Qwen2.5-7B-Instruct, layer 24 of 28. Sample-level relation detection, line dataset (-06 minimal pairs): logistic validity probe on [X[f_k], sum of the other shown fields' activations] (f_k last shown), with the last-only and context-only ablations; per-error-type and per-cell accuracy, controls.
  Needs the full train and test runs 2026-10-25-qwen7b-relation-line-train-01 and 2026-10-25-qwen7b-relation-line-test-01 (-06 data, 2026-10-25).
seed: 0
params:
  train_run_id: 2026-10-25-qwen7b-relation-line-train-01
  test_run_id: 2026-10-25-qwen7b-relation-line-test-01
  # one of the runs' layers; 0 is the constant null control and is rejected
  layer: 24
  # sum = sum of all shown fields (joint); cond = [last shown, sum of the rest] (conditional); last / context = cond's halves
  feature: cond
  # features also probed, for comparison (none of them the main feature)
  ablations: [last, context, sum]
  # logistic regression (lbfgs; ConvergenceWarning is an error); lr_C is the INVERSE regularisation strength
  lr_C: 0.01
  lr_max_iter: 5000
  lr_tol: 0.0001
  decision_threshold: 0.5
  # document-bootstrap interval of the test AUROC
  auroc_n_boot: 1000
  ci_level: 0.95
  ece_n_boot: 2000
  hist_n_bins: 20
  run_controls: true
  # test AUROC is averaged over n_shuffles permuted-train-label fits
  n_shuffles: 3
  shuffled_label_auroc_tolerance: 0.1
  # -- experiments/submit.sh --analysis resources (CPU only; walltime is a placeholder until the smoke run sizes it) --
  omp: 16
  # BLAS threads, below omp: jobs at thread_cap == omp were SIGKILLed on a compute node
  thread_cap: 8
  walltime: "00:30:00"
  # restrict each split to its first N documents (null = all)
  max_docs: 20
