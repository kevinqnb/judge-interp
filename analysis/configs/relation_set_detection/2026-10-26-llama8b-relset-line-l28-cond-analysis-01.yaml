id: 2026-10-26-llama8b-relset-line-l28-cond-analysis-01
project: judge-interp
description: >-
  Llama-3.1-8B-Instruct, layer 28 of 32. Sample-level relation detection, line dataset (-06 minimal pairs): logistic validity probe on [X[f_k], sum of the other shown fields' activations] (conditional; f_k last shown), with the last-only and context-only ablations, scored on matched samples (label rule matches_item on the whole shown subset); per-error-type, per-cell and last-shown-corrupted accuracy, controls.
  Needs the full train and test runs 2026-10-25-llama8b-relation-line-train-01 and 2026-10-25-llama8b-relation-line-test-01 (-06 data, 2026-10-25).
seed: 0
params:
  train_run_id: 2026-10-25-llama8b-relation-line-train-01
  test_run_id: 2026-10-25-llama8b-relation-line-test-01
  # one of the runs' layers; 0 is the constant null control and is rejected
  layer: 28
  # sum = sum of all shown fields (joint); cond = [last shown, sum of the rest] (conditional); last / context = cond's halves
  feature: cond
  # features also probed, for comparison (none of them the main feature)
  ablations: [last, context]
  # logistic regression (lbfgs; ConvergenceWarning is an error); lr_C is the INVERSE regularisation strength
  lr_C: 0.01
  lr_max_iter: 5000
  lr_tol: 0.0001
  decision_threshold: 0.5
  # document-bootstrap interval of the test AUROC
  auroc_n_boot: 1000
  ci_level: 0.95
  ece_n_boot: 2000
  hist_n_bins: 20
  run_controls: true
  # test AUROC is averaged over n_shuffles permuted-train-label fits
  n_shuffles: 10
  shuffled_label_auroc_tolerance: 0.03
  # -- experiments/submit.sh --analysis resources (CPU only; the pair probe on the same runs took 5-19 min) --
  omp: 16
  # BLAS threads, below omp: jobs at thread_cap == omp were SIGKILLed on a compute node
  thread_cap: 8
  walltime: "02:00:00"
  # restrict each split to its first N documents (null = all)
  max_docs: null
