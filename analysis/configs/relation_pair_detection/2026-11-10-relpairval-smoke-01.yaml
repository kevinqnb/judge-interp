id: 2026-11-10-relpairval-smoke-01
project: judge-interp
description: >-
  SMOKE (plumbing only, not a result): first 20 documents of each LM split, 20 document resamples. Same as 2026-11-10-relpairval-01 otherwise.
  Prompt-variant comparison on the intra-document line pairs (-07): per model, the full prompt (2026-11-09 relation_pair_detection runs: field names, presence + type + relation criteria) against the values-only, relation-only prompt (2026-11-10 relation_pair_values runs: same rows, pair order and orientation, read at ' ")\n'). Qwen2.5-7B-Instruct layer 24, Llama-3.1-8B-Instruct layer 28 (as 2026-11-09-relpair-01). INTRA-DOCUMENT CORRUPTED PARENTS ONLY, train and test, minus the pairs whose label would differ if field assignment were ignored (172 train / 27 test: an item's two values under other fields), then balanced per field pair (seed = this config's seed); the test side is drawn from the pairs every run scored, so the four probes are scored on the same pairs. Deciding numbers: values minus full test AUROC per model, with a document-bootstrap interval (comparisons). No judges (they see field names: matched to neither prompt). Controls as 2026-11-09-relpair-01. Needs 2026-11-10-{qwen7b,llama8b}-relpairval-line-{train,test}-01, which did not exist when this config was written.
seed: 0
params:
  # every LM run must have judged these files (parents) and labelled its pairs from these subsets
  train_subsets: data/vrdu/line/train_subsets.json
  test_subsets: data/vrdu/line/test_subsets.json
  train_parents: data/vrdu/line/train.json
  test_parents: data/vrdu/line/test.json
  models:
    - {label: qwen_full, train_run_id: 2026-11-09-qwen7b-relpair-line-train-01, test_run_id: 2026-11-09-qwen7b-relpair-line-test-01, layer: 24, task: relation_pair_detection}
    - {label: qwen_values, train_run_id: 2026-11-10-qwen7b-relpairval-line-train-01, test_run_id: 2026-11-10-qwen7b-relpairval-line-test-01, layer: 24, task: relation_pair_values}
    - {label: llama_full, train_run_id: 2026-11-09-llama8b-relpair-line-train-01, test_run_id: 2026-11-09-llama8b-relpair-line-test-01, layer: 28, task: relation_pair_detection}
    - {label: llama_values, train_run_id: 2026-11-10-llama8b-relpairval-line-train-01, test_run_id: 2026-11-10-llama8b-relpairval-line-test-01, layer: 28, task: relation_pair_values}
  # the error types whose corrupted parents are selected (train and test); report.error_type_names must name exactly these
  error_types: [intra_document]
  # drop the pairs whose label would differ if field assignment were ignored (field_free_valid)
  drop_field_free_mismatch: true
  # [a, b]: AUROC(a) - AUROC(b) on the evaluated pairs, document-bootstrap interval (report.n_boot resamples)
  comparisons: [[qwen_values, qwen_full], [llama_values, llama_full]]
  judges: []
  # pre-corruption pairs (identical prompt prefix to the twin's) may differ by at most this relative norm: bf16 noise
  # reached 0.13-0.14 on the -06 relset runs (Qwen L24, Llama L28); same value as relation_set_detection
  prefix_match_rtol: 0.25
  # logistic regression (lbfgs; ConvergenceWarning is an error); lr_C is the INVERSE regularisation strength
  lr_C: 0.01
  lr_max_iter: 5000
  lr_tol: 0.0001
  decision_threshold: 0.5
  ci_level: 0.95
  # calibration figures and tables (analysis/calibration_report.py): intervals over n_boot document resamples
  report:
    n_boot: 20
    methods: {qwen_full: Qwen (full), qwen_values: Qwen (values), llama_full: Llama (full), llama_values: Llama (values)}
    error_type_names: {intra_document: Intra-document}
    font: Nimbus Roman
    white_frac: 0.35
    mesh_pts: 101
    alpha_floor: 0.15
    band_alpha: 0.35
    alpha_levels: 12
    shuffled_auroc_tolerance: 0.05
    figsize: [3.0, 3.0]
  run_controls: true
  # probes only, TRAINING-label shuffle control: mean test AUROC of n probes refit on permuted train labels must be within the tolerance of 0.5
  n_train_label_shuffles: 3
  train_label_shuffle_auroc_tolerance: 0.2
  # restrict each LM split to its first N documents (null = all)
  max_docs: 20
  # -- experiments/submit.sh --analysis resources (CPU only; ~20k x hidden float32 train features per run, 4 runs) --
  omp: 16
  # BLAS threads, below omp: jobs at thread_cap == omp were SIGKILLed on a compute node
  thread_cap: 8
  walltime: "01:00:00"
