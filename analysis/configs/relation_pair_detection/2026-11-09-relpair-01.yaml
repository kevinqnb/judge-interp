id: 2026-11-09-relpair-01
project: judge-interp
description: >-
  Relation pair detection on the line pairs (-07): the Qwen2.5-7B-Instruct (layer 24) and Llama-3.1-8B-Instruct (layer 28) probes, Clef and Jev (conditional, one pair per prompt, in the LM's orientation), all scored on the same test pairs. A pair is a size-2 row of data/vrdu/line/<split>_subsets.json, label = its own valid. CORRUPTED PARENTS ONLY, train and test, randomly subsampled (seed = this config's seed) to as many valid as invalid pairs in every (error type, field pair) cell; the test side is drawn from the pairs every method scored. Probe = logistic regression on the pair's read-token activation (per-document mean-centred). Controls: field-pair structure baseline (AUROC exactly 0.5, asserted), train-label shuffle, seed determinism, layer-0 constant, prefix known answer (pre-corruption pairs equal their clean twin's).
  Needs 2026-11-09-{qwen7b,llama8b}-relpair-line-{train,test}-01, 2026-11-09-clef-relpair-test-01 and 2026-11-09-jev-relpair-test-01, none of which existed when this config was written.
seed: 0
params:
  # every LM run must have judged these files (parents) and labelled its pairs from these subsets
  train_subsets: data/vrdu/line/train_subsets.json
  test_subsets: data/vrdu/line/test_subsets.json
  train_parents: data/vrdu/line/train.json
  test_parents: data/vrdu/line/test.json
  models:
    - {label: qwen7b_l24, train_run_id: 2026-11-09-qwen7b-relpair-line-train-01, test_run_id: 2026-11-09-qwen7b-relpair-line-test-01, layer: 24}
    - {label: llama8b_l28, train_run_id: 2026-11-09-llama8b-relpair-line-train-01, test_run_id: 2026-11-09-llama8b-relpair-line-test-01, layer: 28}
  # judge: clef | jev (conditional task on experiments/clef-samples/conditional-test-pairs.json)
  judges:
    - {label: clef, judge: clef, run_id: 2026-11-09-clef-relpair-test-01}
    - {label: jev, judge: jev, run_id: 2026-11-09-jev-relpair-test-01}
  # pre-corruption pairs (identical prompt prefix to the twin's) may differ by at most this relative norm: bf16 noise
  # reached 0.13-0.14 on the -06 relset runs (Qwen L24, Llama L28); same value as relation_set_detection
  prefix_match_rtol: 0.25
  # logistic regression (lbfgs; ConvergenceWarning is an error); lr_C is the INVERSE regularisation strength
  lr_C: 0.01
  lr_max_iter: 5000
  lr_tol: 0.0001
  decision_threshold: 0.5
  ci_level: 0.95
  # calibration figures and tables (analysis/calibration_report.py): intervals over n_boot document resamples
  report:
    n_boot: 2000
    methods: {qwen7b_l24: qwen, llama8b_l28: llama, clef: clef, jev: jev}
    error_type_names: {intra_document: Intra-document, cross_item: Cross-item}
    font: Nimbus Roman
    white_frac: 0.35
    mesh_pts: 101
    alpha_floor: 0.15
    band_alpha: 0.35
    alpha_levels: 12
    shuffled_auroc_tolerance: 0.05
    figsize: [3.0, 3.0]
  run_controls: true
  # probes only, TRAINING-label shuffle control: mean test AUROC of n probes refit on permuted train labels must be within the tolerance of 0.5
  n_train_label_shuffles: 10
  train_label_shuffle_auroc_tolerance: 0.05
  # restrict each LM split to its first N documents (null = all)
  max_docs: null
  # -- experiments/submit.sh --analysis resources (CPU only; ~37k x hidden float32 train features per model) --
  omp: 16
  # BLAS threads, below omp: jobs at thread_cap == omp were SIGKILLed on a compute node
  thread_cap: 8
  walltime: "06:00:00"
