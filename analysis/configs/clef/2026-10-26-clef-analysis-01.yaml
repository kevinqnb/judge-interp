id: 2026-10-26-clef-analysis-01
project: judge-interp
description: >-
  Analysis of the Clef-flash direct judge on the -06 minimal-pair test splits (2026-10-25 runs): entity detection
  (main; one P(true) per field), conditional relation detection and one-shot record detection (line samples).
  smECE with bootstrap CI and smooth reliability diagrams, P(valid) histogram, Brier skill score (reference =
  the evaluated set's own label rate), AUROC with a document-bootstrap interval, accuracy, per-stratum detection
  (error type, (type, k) or cell), with/without null-fill and row-context diagnostic on entity, permutation null.
  No probe is fit. Clef is one model, so there is a single config (the probe analyses are per model and layer).
seed: 0
params:
  # kind: entity | conditional | oneshot. bss_ref_rate: a float in (0, 1), or "evaluation_set_rate" (constant
  # forecast at the evaluated set's own valid rate).
  runs:
    - {label: entity_main, kind: entity, run_id: 2026-10-25-clef-entity-main-test-01, bss_ref_rate: evaluation_set_rate}
    - {label: conditional_line, kind: conditional, run_id: 2026-10-25-clef-conditional-line-test-01, bss_ref_rate: evaluation_set_rate}
    - {label: oneshot_line, kind: oneshot, run_id: 2026-10-25-clef-oneshot-line-test-01, bss_ref_rate: evaluation_set_rate}
  decision_threshold: 0.5
  # seeds the other-document twins of null-fill entity spans
  twin_seed: 0
  # document-bootstrap interval of the AUROC
  auroc_n_boot: 1000
  ci_level: 0.95
  ece_n_boot: 2000
  hist_n_bins: 20
  # permutation null of the metrics: mean AUROC over n_shuffles label permutations must be within tolerance of 0.5
  n_shuffles: 200
  permutation_auroc_tolerance: 0.03
  # -- experiments/submit.sh --analysis resources (CPU only) --
  omp: 8
  # equals omp, as in the finished 2026-10-26-clef-analysis-01 run
  thread_cap: 8
  walltime: "01:00:00"
