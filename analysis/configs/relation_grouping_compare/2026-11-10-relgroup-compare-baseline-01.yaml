id: 2026-11-10-relgroup-compare-baseline-01
project: judge-interp
description: >-
  Known-answer check of analysis/relation_grouping_compare.py before any grouping run: the same pipeline with models = the ORIGINAL relation-detection test runs (so 'grouping' = 'baseline').
  Prediction: for the eligible example prompts of 2026-11-09-relclust-01, grouping_* equals baseline_* exactly (win_frac, twin_win_frac, contrast); the 3 cross_item prompts are recorded as not eligible. Also gives the 12 example figures in the current plot style. Reads the full runs (all documents).
seed: 0
params:
  models:
    - {label: qwen7b_l24, run_id: 2026-10-27-qwen7b-relation-line-test-01, layer: 24}
    - {label: llama8b_l28, run_id: 2026-10-27-llama8b-relation-line-test-01, layer: 28}
  # the earlier clustering run whose 12 example prompts are reused, and its per-prompt metric files (field_doc_mean, first distance)
  examples_from: 2026-11-09-relclust-01
  baseline_prompt_metrics:
    qwen7b_l24: 2026-11-09-relclust-01/artifacts/qwen7b_l24_provenance_prompt_metrics.npz
    llama8b_l28: 2026-11-09-relclust-01/artifacts/llama8b_l28_provenance_prompt_metrics.npz
  # the relation_detection runs the grouping runs repeat
  original_runs:
    qwen7b_l24: 2026-10-27-qwen7b-relation-line-test-01
    llama8b_l28: 2026-10-27-llama8b-relation-line-test-01
  preprocess: [raw, field_doc_mean]
  distances: [euclidean, cosine]
  # prompts with a field whose (document, field) group has fewer rows are excluded (a 2-row group centres to +-half a difference)
  min_rows_per_doc_field: 8
  # an entity centred to norm <= this (identical in every row of its group) is zero: its prompt is excluded
  zero_norm_tol: 1.0e-6
  max_docs: null
  n_permutations: 200
  random_tolerance: 0.05
  random_min_prompts: 100000   # 3 documents: the random-vector assertion is not meaningful on so few prompts (n is reported)
  n_boot: 1000
  ci_level: 0.95
  # example figures
  plot_preprocess: field_doc_mean
  example_cells: [intra_document:k1, intra_document:k2, intra_document:k3, cross_item:k2]
  example_m: 5
  n_example_docs: 3
  plot:
    native_colour: "#1f77b4"
    corrupted_colour: "#d62728"
    link_native_colour: "#000000"
    link_incidental_colour: "#c8c8c8"
    link_width: 1.0
    panel_size: 3.4
    marker_size: 60
    field_names: {channel: channel, program_desc: desc, program_start_date: start, program_end_date: end, sub_amount: amount}
    label_fontsize: 7
    title_fontsize: 8
    dpi: 150
  # -- experiments/submit.sh --analysis resources (CPU only; PLACEHOLDERS: the smoke on 20 docs took ~1 min; 8498 x 3584 float64 copies ~0.25 GB each) --
  omp: 4
  thread_cap: 4
  walltime: "00:30:00"
