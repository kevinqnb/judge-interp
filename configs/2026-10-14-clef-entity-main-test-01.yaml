id: 2026-10-14-clef-entity-main-test-01
project: judge-interp
task: clef_entity_row
description: >-
  Clef-flash entity detection, main dataset, test split: one record per row (OCR text + row), one noul
  question per non-null field, P(true) stored per question. Same row draw as the Qwen entityrow main test
  run (128 per stratum). Over-length documents are excluded and recorded.
seed: 0
params:
  data_root: data
  model: Cloudflare/clef-flash
  # pinned HF revision of the model + joint_schema_model.py release code
  revision: 8b2e5fd17c09fd49bc2880b805d5323ec7ff4ff3
  dataset: main
  split: test
  device: cuda
  dtype: bfloat16
  # encode_record silently truncates beyond this; records longer than it are handled per overlong_docs.
  max_length: 16384
  # "exclude": drop records over max_length and list them (artifacts/excluded_overlong.json); "error": raise.
  overlong_docs: exclude
  # "none": the document's own OCR text; "other_document": another document's (ablation: AUROC should fall toward 0.5).
  context_control: none
  # re-score the first N records and assert bitwise-identical logits (0 = off)
  determinism_check_n: 5
  # score a hand-built known-answer record first and assert its answer
  known_answer_check: true
  error_types: [inter_document, cross_type]
  # Stratified row draw (seeded by `seed`); keys must be "valid" + error_types.
  rows_per_stratum:
    valid: 128
    inter_document: 128
    cross_type: 128

  # -- scripts/submit.sh resources --
  # 9B bf16 (~19 GB weights) plus up to 16k-token records. gpu_memory / walltime are placeholders pending a GPU timing pilot.
  gpu_type:
  gpu_memory: 40G
  gpu_c: 7.0
  omp: 8
  walltime: "01:30:00"
