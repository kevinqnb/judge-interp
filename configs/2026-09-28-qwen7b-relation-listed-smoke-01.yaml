id: 2026-09-28-qwen7b-relation-listed-smoke-01
project: judge-interp
task: relation_detection_listed
description: >-
  GPU smoke for relation_detection_listed: 5 train documents, Qwen2.5-7B bf16. Confirms plumbing on GPU (verify_read_point, span-to-token mapping inside the QUERY block, no-logits footprint) and gives per-document timing to size the train/test walltimes. Not a result.
seed: 0
params:
  data_root: data
  model: Qwen/Qwen2.5-7B-Instruct
  split: train
  # Embedding output and post-final-norm only (RelationDetectionLM enforces this).
  layers: [0, "last"]
  dtype: bfloat16
  device: cuda
  # Same margin as 2026-09-27-qwen7b-relation-line-train-01; the new prompt has no
  # per-entry cue, so its query is shorter, but the instructions now carry the
  # field-type descriptions.
  context_token_limit: 28000
  doc_subset: {n: 5, seed: 0}
  verify_read_point: true
  min_valid_per_type: 1
  # A relation needs >= 2 types; 1 test document has only program_desc.
  min_types_per_doc: 2

  # -- scripts/submit.sh resources --
  # No logits are materialised (logits_to_keep=1). 40G/7.0 and the per-item
  # timing (~1.8s/item, dominated by model load for small jobs) are inherited
  # from 2026-09-27-qwen7b-relation-line-train-01's smoke; not re-measured for
  # this task -- run the smoke config first.
  gpu_type:
  gpu_memory: 40G
  gpu_c: 7.0
  omp: 8
  walltime: "00:30:00"
