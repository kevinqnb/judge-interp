id: 2026-09-15-llama8b-repr-main-train-01
project: judge-interp
task: record_judge
description: >-
  Collect judge representations at layers 1, 16, 32 (32 = last, post-final-norm;
  evenly spaced from the first transformer-block output to the last) for every
  row of data/vrdu/main/train.json (5130 rows: 513 valid + 513 x k=1..9 invalid,
  num_invalid_fields balanced 513/group) using Llama-3.1-8B-Instruct. Feeds
  analysis/representations.ipynb's PCA-by-num_invalid_fields analysis.
seed: 0
params:
  data_root: data
  model: meta-llama/Llama-3.1-8B-Instruct
  dataset: main
  split: train
  layers: [1, 16, 32]
  dtype: bfloat16
  device: cuda
  include_cohesion: true
  # Token-aware, not char-aware (changed 2026-09-15; was context_char_limit).
  # Checked against the raw OCR text alone, via params["model"]'s tokenizer --
  # not the full instructions+query+chat-template prompt built at judge time.
  # Measured 2026-09-15 with the real Qwen2.5-7B-Instruct tokenizer: worst-case
  # overhead beyond the raw context (413-token cohesion-on instructions + up to
  # 158-token query + ~40-token chat-template wrapper) is ~610 tokens, so the
  # tight ceiling for this value is 32768 - 610 = 32158
  # (max_position_embeddings). 30000 is intentionally looser than that tight
  # bound -- a round number with ~2700 tokens of slack to absorb future
  # instruction/query growth without recomputing the exact ceiling -- while
  # still sitting well below Qwen's 32768-token limit and far above the real
  # corpus's measured max (17745 tokens, 2026-09-10).
  context_token_limit: 30000
  row_subset: null
  # Left on: verify_read_point's bf16-on-GPU determinism check has not yet
  # passed for this (model, device, dtype) outside 2026-09-10-repr-smoke-01 --
  # keep it on until the smoke job (or this run itself) confirms it, and it's
  # cheap regardless (one extra prefill against 5130 rows).
  verify_read_point: true

  # -- scripts/submit.sh resources --
  gpu_type:
  gpu_memory: 40G
  gpu_c: 7.0
  omp: 8
  # Unconfirmed estimate, not a measurement: budgeted at <=2.5s/row (roughly
  # 2x scholarlm's ~3s/row for qwen-2.5-7b+nnsight on L40S, which judged much
  # longer full-paper contexts (10-47k tok) with attention-probs + multi-layer
  # capture -- this run's contexts average 3072 tok / max 17745 tok, single
  # layer, no attention capture, so should be faster per row). 5130 x 2.5s =
  # 3.6h; walltime below is a ~2.2x safety margin over that.
  # Update once 2026-09-10-repr-smoke-01's log.txt gives real seconds/row.
  walltime: "08:00:00"
