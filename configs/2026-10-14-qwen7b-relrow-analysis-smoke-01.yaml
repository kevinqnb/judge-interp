id: 2026-10-14-qwen7b-relrow-analysis-smoke-01
project: judge-interp
description: >-
  Smoke for analysis/relation_detection_row.py (Qwen2.5-7B-Instruct, line train/test relrow runs, first 20
  documents of each split): per-document mean-centred layer-20 closing-quote activations; one random subset of
  each row's fields per sample (invalid iff any field in it is invalid); a 10-dim vector of Euclidean distances
  per field pair (0 when absent); train/test cut to equal per-class counts; logistic validity probe; smECE /
  Brier skill score / AUROC on test, per-error-type accuracy. Plumbing only: the sets are tiny, controls are off.
  Needs 2026-10-14-qwen7b-relrow-line-{train,test}-01 to have finished.
seed: 0
params:
  train_run_id: 2026-10-14-qwen7b-relrow-line-train-01
  test_run_id: 2026-10-14-qwen7b-relrow-line-test-01
  # one of the runs' layers [0, 8, 14, 20, 24, 28]; 0 is the constant null control and is rejected
  layer: 20
  # samples: distinct random subsets (size >= min_subset_size) per source row, then cut to equal class counts
  samples_per_row: 2
  min_subset_size: 2
  n_per_class_train: 50
  n_per_class_test: 25
  # value of a feature slot whose field pair is not in the sample's subset
  absent_fill: 0.0
  # standardize each pair's distances with its train mean/std over present entries (applied to both splits);
  # absent slots are then set to absent_fill (0.0 = the pair's mean distance). false = raw distances, absent = absent_fill.
  standardize_pair_distances: true
  # logistic regression (lbfgs; ConvergenceWarning is promoted to an error)
  lr_C: 1.0
  lr_max_iter: 5000
  lr_tol: 0.0001
  decision_threshold: 0.5
  # smooth ECE (relplot) + bootstrap for its CI
  ece_n_boot: 200
  # controls
  run_controls: false
  # test AUROC is averaged over n_shuffles permuted-train-label fits (one permutation is too noisy)
  n_shuffles: 400
  shuffled_label_auroc_tolerance: 0.03
  # -- scripts/submit.sh --analysis resources (CPU only; walltime is a placeholder) --
  omp: 8
  walltime: "00:30:00"
  # smoke: restrict each split to its first N documents (null = all)
  max_docs: 20
