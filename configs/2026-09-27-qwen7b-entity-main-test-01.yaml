id: 2026-09-27-qwen7b-entity-main-test-01
project: judge-interp
task: entity_detection
description: >-
  Collect entity-detection representations (layers 1, 14, 28) for every
  surviving (document, field) entity list built from
  data/vrdu/main/test.json using Qwen2.5-7B-Instruct. Same thresholds as
  2026-09-27-qwen7b-entity-main-train-01, over main's 128-document test split:
  984 lists (168 skipped) totaling 984 valid + 4734 decoy entities (2026-09-27
  measurement). Held-out counterpart to
  2026-09-27-qwen7b-entity-main-train-01; not used by the initial train-only
  analysis but collected now so it's available for held-out checks.
seed: 0
params:
  data_root: data
  model: Qwen/Qwen2.5-7B-Instruct
  dataset: main
  split: test
  layers: [1, 14, 28]
  dtype: bfloat16
  device: cuda
  # See 2026-09-27-qwen7b-entity-main-train-01.yaml for the margin rationale.
  context_token_limit: 28000
  row_subset: null
  verify_read_point: true
  min_valid_per_list: 1
  min_invalid_per_list: 1
  max_invalid_per_list: 30

  # -- scripts/submit.sh resources --
  gpu_type:
  gpu_memory: 40G
  gpu_c: 7.0
  omp: 8
  # See 2026-09-27-qwen7b-entity-main-train-01.yaml for the <=2.5s/item basis
  # (unconfirmed pending 2026-09-27-qwen7b-entity-smoke-01). 984 x 2.5s =
  # 0.68h; padded generously since fixed model-load time is a larger fraction
  # of a job this small (mirrors 2026-09-10-repr-main-test-01's margin).
  walltime: "02:00:00"
