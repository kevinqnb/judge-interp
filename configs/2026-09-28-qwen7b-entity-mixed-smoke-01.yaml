id: 2026-09-28-qwen7b-entity-mixed-smoke-01
project: judge-interp
task: entity_detection_mixed
description: >-
  GPU smoke for entity_detection_mixed: 5 train documents x 2 samples, Qwen2.5-7B bf16. Confirms plumbing on GPU (verify_read_point, span mapping, no-logits memory footprint) and gives per-prompt timing to size the train/test walltimes. Not a result.
seed: 0
params:
  data_root: data
  model: Qwen/Qwen2.5-7B-Instruct
  split: train
  # Embedding output and post-final-norm only (EntityDetectionLM enforces this).
  layers: [0, "last"]
  dtype: bfloat16
  device: cuda
  context_token_limit: 28000
  doc_subset: {n: 5, seed: 0}
  verify_read_point: true
  # s prompts per document; k ~ Uniform{k_min..m} per prompt (k_min=0 keeps
  # all-valid prompts as a control).
  samples_per_doc: 2
  k_min: 0

  # -- scripts/submit.sh resources --
  # No logits are materialised (logits_to_keep=1), so the 40G/7.0 combination
  # confirmed for Qwen2.5-7B record_judge runs is the starting point. Worst
  # k=m prompt on data/ is ~19k tokens (2026-09-28 measurement).
  gpu_type:
  gpu_memory: 40G
  gpu_c: 7.0
  omp: 8
  walltime: "00:30:00"
