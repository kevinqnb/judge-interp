id: 2026-09-28-qwen7b-relation-listed-train-01
project: judge-interp
task: relation_detection_listed
description: >-
  Relation detection over line-field entity lists, train split: 509 documents, 11762 spans (2026-09-28 measurement; none skipped by min_types_per_doc=2). One prompt per document; entries are bare numbered JSON values (no valid? cue) under TYPE n ENTITIES headers, and the instructions describe each rendered field type. Records the hidden state at each entity's last value token in its prompted list, at layer 0 and post-final-norm only. Ground-truth tuple membership is written to artifacts/tuple_membership.json (never rendered). Supersedes 2026-09-27-qwen7b-relation-line-train-01's prompt/span design.
seed: 0
params:
  data_root: data
  model: Qwen/Qwen2.5-7B-Instruct
  split: train
  # Embedding output and post-final-norm only (RelationDetectionLM enforces this).
  layers: [0, "last"]
  dtype: bfloat16
  device: cuda
  # Same margin as 2026-09-27-qwen7b-relation-line-train-01; the new prompt has no
  # per-entry cue, so its query is shorter, but the instructions now carry the
  # field-type descriptions.
  context_token_limit: 28000
  doc_subset: null
  verify_read_point: true
  min_valid_per_type: 1
  # A relation needs >= 2 types; 1 test document has only program_desc.
  min_types_per_doc: 2

  # -- scripts/submit.sh resources --
  # No logits are materialised (logits_to_keep=1). 40G/7.0 and the per-item
  # timing (~1.8s/item, dominated by model load for small jobs) are inherited
  # from 2026-09-27-qwen7b-relation-line-train-01's smoke; not re-measured for
  # this task -- run the smoke config first.
  gpu_type:
  gpu_memory: 40G
  gpu_c: 7.0
  omp: 8
  walltime: "02:00:00"
