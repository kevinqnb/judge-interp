id: 2026-10-22-vrdu-invalids-05
project: judge-interp
description: >-
  Fixes -04 label noise and adds cross_item (data/vrdu/ISSUES.md, Gaps 1-2). Label rule: shown values
  are valid iff they are one valid line item's; rows and subsets that violate it are excluded.
  cross_type no longer draws from the row's own item. New subset-only cross_item swaps two shown
  fields (k=2). Subsets give each of the four error types n_per_error_type invalid samples. Line
  inter/intra have their own RNG streams. -04 numbers do not carry over (-04 data: commit 3a7814e).
seed: 0
params:
  data_root: data/vrdu

  main:
    # Unchanged from -02 (inter_document only): one invalid row per achievable
    # k in this inclusive range, pools compiled per split.
    k_range: [1, 9]
    pool_scope: per_split

  line:
    # Unchanged from -02 (inter_document, intra_document).
    k_range: [1, 5]

  # A field whose base value is null MAY be chosen for invalidation and given a
  # non-null value; a non-null base value is NEVER replaced with null.
  corrupt_from_null: true
  corrupt_to_null: false

  dates:
    # Ordering enforced on every generated row of every error type (cross_type
    # included): parsed(from) <= parsed(to) whenever BOTH parse. A null or an OCR
    # fragment (e.g. "/08/20") has no position in time and never blocks or violates it.
    # (cross_item is exempt.)
    main_fields: [flight_from, flight_to]
    line_fields: [program_start_date, program_end_date]
    year_pivot: 50  # 2-digit year YY -> 20YY if YY < pivot else 19YY

  cross_type:
    # A cross_type field takes a value of another same-kind field of the document (never the
    # row's own line item). Fields in no kind are never touched; channel is left out on purpose.
    # The kinds also define the equivalence key used by the label rule.
    kinds:
      name: [advertiser, agency, property, tv_address, product]
      date: [flight_from, flight_to, program_start_date, program_end_date]
      amount: [gross_amount, sub_amount]
    # One cross_type row per achievable k in this range (k = number of kinded
    # fields at most: 8 main, 3 line).
    main:
      k_range: [1, 8]
    line:
      k_range: [1, 3]

  # Read only by build_vrdu_manifest.py. k_values: the k kept for every row error type.
  # n_base_rows: null = every common-support base row.
  manifest:
    seed: 0
    main:
      k_values: [1, 2, 3, 4, 5, 6]
      n_base_rows: {train: null, test: null}
    line:
      k_values: [1, 2, 3]
      n_base_rows: {train: null, test: null}

  # Read only by build_vrdu_subsets.py (line only). Per source row, samples_per_row random ordered field
  # subsets; invalid ones matching a real item are dropped; cross_item swaps two shown fields of a clean
  # subset. Each replicate: identical field-set counts in both classes, n_per_error_type invalid samples
  # per error type (within max_error_type_share_deviation). samples_per_row is 6 (was 4) so the test
  # split has enough valid 5-field samples.
  subsets:
    seed: 0
    source: manifest
    n_replicates: 5
    samples_per_row: 6
    min_subset_size: 2
    n_per_error_type: {train: 1266, test: 316}
    balance_by: field_set_error_type
    max_error_type_share_deviation: 0.03
